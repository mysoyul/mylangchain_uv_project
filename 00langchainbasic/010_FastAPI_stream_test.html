<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SSE 스트리밍 테스트</title>
</head>
<body>
<h1>SSE 스트리밍 테스트</h1>

<textarea id="question" rows="3" cols="60">LangChain이 뭐야?</textarea><br>
<button id="send">전송</button>
<button id="clear">결과 지우기</button>

<pre id="answer" style="white-space: pre-wrap"></pre>

<script>
  // 결과 영역만 초기화 (질문 입력창은 유지)
  document.getElementById("clear").onclick = () => {
    document.getElementById("answer").textContent = "";
  };

  // 같은 출처에서 서빙되므로 상대 경로 사용 (CORS 불필요)
  document.getElementById("send").onclick = async () => {
    const answer = document.getElementById("answer");
    answer.textContent = "";

    // 1) POST 로 질문 전송
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: document.getElementById("question").value }),
    });

    // 2) 응답 본문을 조각(chunk)이 도착하는 대로 읽기
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      // 3) 줄 단위로 나누고, "data: " 로 시작하는 줄만 처리 (마지막 미완성 줄은 buffer 에 보관)
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ") || line === "data: [DONE]") continue;
        const data = JSON.parse(line.slice(6));
        // 4) 토큰을 화면에 이어 붙이기 (오류 이벤트면 오류 표시)
        answer.textContent += data.token ?? `\n[오류: ${data.error}]`;
      }
    }
  };
</script>
</body>
</html>
